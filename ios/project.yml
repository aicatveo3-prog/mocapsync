# XcodeGen 프로젝트 스펙.
#
# 왜 .xcodeproj 를 커밋하지 않고 이 YAML 을 쓰는가:
# 개발자(AI)는 Windows 에서 Xcode 를 실행할 수 없어 .xcodeproj(pbxproj) 를
# 손으로 쓰면 오류를 잡기 어렵습니다. XcodeGen 이 CI 에서 이 YAML 로부터
# 프로젝트를 생성하므로, 사람이 읽고 고칠 수 있는 파일만 관리합니다.
#
# 생성: cd ios && xcodegen generate

name: MocapSync

options:
  bundleIdPrefix: com.mocapsync
  deploymentTarget:
    # 실기기가 iOS 17.5.1 이므로 17.0 으로 잡습니다.
    # 러너 Xcode 가 26.x 로 최신이라 너무 낮은 타깃은 경고/오류가 날 수 있습니다.
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.3.0"
    # ★ CI 가 --build-number 로 덮어씁니다 (GitHub run_number).
    #   여기 값은 로컬 빌드용 기본값일 뿐입니다.
    #
    #   왜 이렇게 하는가: 실기기 테스트를 사람이 대신 하기 때문에,
    #   "지금 폰에 깔린 게 방금 만든 빌드인가"를 확인할 수 없으면 디버깅이 막힙니다.
    #   실제로 0.2.0(build 1) 을 고정해 둔 탓에, 코드를 고치고 새 IPA 를 설치해도
    #   진단 리포트가 이전과 똑같이 찍혀 설치 성공 여부를 알 수 없었습니다.
    CURRENT_PROJECT_VERSION: "0"
    # ★ CI 가 커밋 해시로 덮어씁니다. 로컬 빌드는 "local" 로 남습니다.
    GIT_COMMIT: "local"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # CI 는 서명 없이 빌드합니다. 서명은 Sideloadly 가 설치 시점에 붙입니다.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  MocapSync:
    type: application
    platform: iOS
    sources:
      # 앱 전용 코드 (SwiftUI, AVFoundation)
      - path: App
      # ★ 순수 로직을 같은 파일로 공유합니다.
      #   SwiftPM 패키지 의존성이 아니라 "같은 소스를 두 빌드 시스템이 본다"는 구조.
      #   CI 에서 SPM 의존성 해석이 실패할 여지를 없앱니다.
      - path: Sources/MocapSyncCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mocapsync.ios
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용
        # ★ INFOPLIST_FILE 을 직접 지정하지 마세요.
        #   아래 info: 블록이 plist 를 생성하면서 INFOPLIST_FILE 을 자동으로
        #   설정합니다. 여기서 빈 값으로 덮어쓰면
        #   "Build input file cannot be found: .../Info.plist" 로 실패합니다.
        #   (실제로 이 실수로 CI 가 한 번 깨졌습니다)
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: MocapSync
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ★ 어느 커밋으로 만든 빌드인지 앱 안에서 확인할 수 있게 심습니다.
        #   CI 가 GIT_COMMIT 을 짧은 해시로 넘깁니다.
        GitCommit: "$(GIT_COMMIT)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # ★ USB 로 영상·사이드카를 PC 로 꺼낼 수 있게 합니다.
        #
        #   Windows 의 Apple Devices 앱 → 아이폰 → 파일 → MocapSync 에
        #   Documents/ 가 그대로 보입니다. 거기 sessions/<세션ID>/ 안에
        #   .mov 와 .json 이 있습니다.
        #
        #   왜 필요한가: 4단계(WiFi 자동 업로드)가 아직 없습니다. 그런데 3단계의
        #   목적은 "Pose2Sim 에 넣을 수 있는 영상 + 타임스탬프"를 만드는 것이라
        #   PC 로 옮길 방법이 없으면 3단계를 검증할 수 없습니다.
        #   또한 4단계가 생긴 뒤에도 큰 영상은 USB 가 WiFi 보다 빠르므로
        #   대안으로 남겨 둘 값입니다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 권한 설명문. 없으면 iOS 가 앱을 즉시 종료시킵니다.
        NSCameraUsageDescription: >-
          여러 대의 아이폰으로 동시에 촬영해 3D 모션을 복원하기 위해
          카메라에 접근합니다. 영상은 이 기기와 사용자의 PC 에만 저장됩니다.
        NSMicrophoneUsageDescription: >-
          영상 녹화 시 오디오 트랙이 포함될 수 있습니다. 모션 복원에는
          사용되지 않습니다.
        # ★ iOS 14+ 에서 로컬 네트워크 통신에 필수. 없으면 조용히 실패합니다.
        NSLocalNetworkUsageDescription: >-
          같은 WiFi 에 있는 다른 아이폰과 PC 를 찾아 촬영 시각을 맞추기 위해
          로컬 네트워크를 사용합니다.
        # ★ mDNS 로 찾을 서비스 타입을 미리 선언해야 합니다.
        NSBonjourServices:
          - _mocapsync._tcp
          - _mocapsync._udp
        # 화면이 꺼지면 촬영이 끊기므로 앱에서 제어합니다 (코드에서 설정)
        UIApplicationSupportsIndirectInputEvents: true
